s+=box(26,409,1227,61,'#102d43','#2d5572',6)+txt(phase>=2?'C₁、C₂ 的构建历史不同':'观察 C 在生成时可见的前缀',46,445,22,phase>=2?C.bad:C.ink,600)+txt('B 仍可能间接携带 A 的信息',927,446,15,C.muted);
return {svg:shell(s),phase};}

function install(){routes=[];let r=scene==='gpu'?gpu():scene==='compact'?compact():history();$('stage').innerHTML=r.svg;document.querySelectorAll('[data-route]').forEach(g=>{const path=$(g.dataset.route),pos=path.getPointAtLength(path.getTotalLength()*+g.dataset.progress);g.setAttribute('transform',`translate(${pos.x},${pos.y})`);});
$('scrub').value=t/duration[scene]*1000;$('time').textContent=`${t.toFixed(1)} / ${duration[scene]} s`;$('status').textContent=(scene==='gpu'?`Tile ${r.tile+1}　`:'')+phaseNames[scene][r.phase];$('play').textContent=playing?'Ⅱ 暂停':'▶ 播放';
if(scene==='gpu'){let err=Math.max(...online(4).o.map((v,i)=>Math.abs(v-dense()[i])));$('readout').textContent=`logical L${r.tile} → physical P${mapping[r.tile]}\nQ${query}  /  已累加 ${r.tile+(r.phase===3&&((t-r.tile*6)/1.5-r.phase)>=.92?1:0)} 个 tile\nm=${Number.isFinite(r.state.m)?r.state.m.toFixed(6):'-∞'}   ℓ=${r.state.l.toFixed(6)}\no=[${r.state.o.map(v=>v.toFixed(7)).join(', ')}]`;}
else if(scene==='compact'){$('readout').textContent=`keep = {${[...r.plan.keep].sort((a,b)=>a-b).join(', ')}}\nmove = ${r.plan.moves.map(([a,b])=>`${a}→${b}`).join('  ')}\n源目的交集：${r.plan.moves.some(([a])=>r.plan.moves.some(([,b])=>a===b))?'非空':'∅（无覆盖冲突）'}\n有效项 ${r.plan.keep.size}，保留页 ${r.plan.nPages}，可回收 ${8-r.plan.nPages} 页`;}
else $('readout').textContent=`① append(C, prefix={A,B}); drop(A)\n② drop(A); append(C, prefix={B})\n最终活跃 KV 标签：两者都是 [B,C]\nC 的生成上下文：{A,B} / {B}\n复用键需要区分 token、位置和操作历史`;
$('stage').querySelectorAll('[data-page]').forEach(g=>{g.onclick=()=>{playing=false;selectedPage=+g.dataset.page;let j=mapping.indexOf(selectedPage);if(j>=0)t=j*6;else{mapping[Math.min(3,Math.floor(t/6))]=selectedPage;mapping=[...new Set(mapping)];for(let p=0;mapping.length<4;p++)if(!mapping.includes(p))mapping.push(p);}install();};g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};});
$('stage').querySelectorAll('[data-slot]').forEach(g=>{g.onclick=()=>{playing=false;let id=+g.dataset.slot,arr=baseOrder.slice(0,keepN),j=arr.indexOf(id);if(j>=0&&arr.length>1)arr.splice(j,1);else if(j<0)arr.push(id);baseOrder.splice(0,32,...arr,...Array.from({length:32},(_,i)=>i).filter(v=>!arr.includes(v)));keepN=arr.length;t=0;options();install();};g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};});
return r;}
function options(){if(scene==='gpu'){$('options').innerHTML='<label>布局 <select id="layout"><option value="paged">非连续分页</option><option value="contiguous">连续对照</option></select></label><label>通道 <select id="query">'+[0,1,2,3].map(i=>`<option value="${i}">Q${i}</option>`).join('')+'</select></label><button id="shuffle">重排物理页</button>';$('layout').value=layout;$('query').value=query;$('layout').onchange=e=>{layout=e.target.value;mapping=layout==='paged'?[7,2,10,4]:[0,1,2,3];install();};$('query').onchange=e=>{query=+e.target.value;install();};$('shuffle').onclick=()=>{mapping=mapping.map(p=>(p+5)%12);install();};}
else if(scene==='compact'){$('options').innerHTML=`<label>保留预算 <input id="budget" type="range" min="1" max="32" value="${keepN}" style="width:125px;vertical-align:middle"> <span id="budgetN">${keepN}/32</span></label>`;$('budget').oninput=e=>{keepN=+e.target.value;$('budgetN').textContent=keepN+'/32';t=0;playing=false;install();};}else $('options').innerHTML='<span class="tip">逐阶段比较两条执行轨迹</span>';}
function details(){const d={gpu:['分页与 IO tiling 解决不同问题','m′ = max(m, max S<sub>j</sub>)，p = exp(S<sub>j</sub> − m′)<br>ℓ′ = e<sup>m−m′</sup>ℓ + Σp，u′ = e<sup>m−m′</sup>u + pV<sub>j</sub><br>o = u / ℓ','分页允许逻辑 KV 块映射到不连续物理页；tile 载入片上后，Q 复用并维护在线 softmax 状态。右侧 query/head 可独立调度。切换 Q0–Q3，查看各通道的累积结果。','点击物理页改变映射；切换连续布局，对比相同数据的不同存放方式。','<a href="https://arxiv.org/abs/2309.06180" target="_blank" rel="noopener">PagedAttention, 2023</a> · <a href="https://arxiv.org/abs/2205.14135" target="_blank" rel="noopener">FlashAttention, 2022</a>'],compact:['有效条目数与物理页数之间的缺口','N<sub>retained pages</sub> = ⌈ N<sub>retained KV</sub> / slots_per_page ⌉','图中先生成 keep mask，再把尾部目标区域以外的保留项映射到空目的槽。已经位于目标区域的保留项原地保留。源和目的集合不相交，避免并行复制互相覆盖，最后释放完全空出的页。','点击条目调整保留集合，或拖动预算。沿曲线观察条目搬移，再看空页回收。','<a href="https://arxiv.org/abs/2609.31395v1" target="_blank" rel="noopener">ActKV, 2026 · §7.2</a>'],history:['缓存的身份包含构建它的历史','C(T, operation_history) ≠ C(T, other_history)<br>K<sub>q</sub> = R(q) R(p)<sup>−1</sup> K<sub>p</sub>','删除 A 的 KV 条目不会追溯修改已生成的 B 或 C。两条轨迹即使最终活跃条目的标签与位置相同，C 构建时可见的前缀也不同。移动位置时还需处理 RoPE 的重编码，位置一致也不能消除不同上下文带来的历史差异。','B[A] 表示 B 的状态已吸收 A 的信息。比较两条轨迹中 C 的生成时刻与可见历史。','<a href="https://arxiv.org/abs/2610.28577v1" target="_blank" rel="noopener">Cache Engineering for Agents, 2026 · Fig.5 / §3.4</a>']};let x=d[scene];$('detailTitle').textContent=x[0];$('formula').innerHTML=x[1];$('explanation').textContent=x[2];$('hint').textContent=x[3];$('sources').innerHTML=x[4];}
function setScene(s){s=['gpu','compact','history'].includes(s)?s:'gpu';scene=s;t=0;playing=false;document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===s));options();details();install();}
function step(dir){playing=false;const delta=scene==='gpu'?1.5:scene==='compact'?4:4.5;t=Math.max(0,Math.min(duration[scene]-.001,(Math.floor((t+.001)/delta)+dir)*delta));install();}
$('play').onclick=()=>{playing=!playing;if(t>=duration[scene]-.01)t=0;last=performance.now();install();};$('next').onclick=()=>step(1);$('prev').onclick=()=>step(-1);$('reset').onclick=()=>{playing=false;t=0;install();};$('speed').onchange=e=>speed=+e.target.value;$('scrub').oninput=e=>{playing=false;t=+e.target.value/1000*(duration[scene]-.001);install();};$('fullscreen').onclick=()=>{const el=document.querySelector('main');if(document.fullscreenElement)document.exitFullscreen();else el.requestFullscreen();};document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>setScene(b.dataset.scene));
document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();$('play').click();}if(e.key==='ArrowRight'){e.preventDefault();step(1);}if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}if(e.key.toLowerCase()==='r')$('reset').click();});
function loop(now){if(playing){t+=(now-last)/1000*speed;if(t>=duration[scene]){t=duration[scene]-.001;playing=false;}install();}last=now;requestAnimationFrame(loop);}requestAnimationFrame(loop);
window.lab={setScene,renderFrame:(s,time)=>{if(scene!==s)setScene(s);playing=false;t=Math.max(0,Math.min(duration[s]-.001,time));return install();},online,dense,plan,routeAudit:()=>[...document.querySelectorAll('[data-route]')].map(g=>{let p=$(g.dataset.route),pos=p.getPointAtLength(p.getTotalLength()*+g.dataset.progress),matrix=g.transform.baseVal.consolidate().matrix;return {route:g.dataset.route,error:Math.hypot(pos.x-matrix.e,pos.y-matrix.f)};}),state:()=>({scene,t,mapping,query,keepN}),setBudget:n=>{keepN=n;options();install();}};
window.addEventListener('hashchange',()=>setScene(location.hash.slice(1)));
window.renderFrame=window.lab.renderFrame;const qs=new URLSearchParams(location.search);if(qs.has('capture'))document.body.classList.add('capture');if(qs.has('embed'))document.body.classList.add('embed');setScene(qs.get('scene')||location.hash.slice(1)||'gpu');
})();
</script></body></html>
